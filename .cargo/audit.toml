[advisories]
# The following advisories affect transitive dependencies of platform SDKs
# (serenity for Discord and matrix-sdk for Matrix).
#
# serenity 0.12.5 → tokio-tungstenite 0.21 → rustls 0.22 → rustls-webpki 0.102.8
# - RUSTSEC-2026-0049, RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104:
#   TLS cert validation in rustls-webpki 0.102.8.
# - RUSTSEC-2026-0382:
#   Distrusted intermediate cert handling in rustls-webpki 0.102.8.
# - RUSTSEC-2026-0346, RUSTSEC-2026-0349:
#   Debug impl exposing TLS secrets and classical key exchange downgrade in rustls 0.22.4.
# Risk assessment: Connections to Discord gateway are outbound TLS to discord.com.
# Exploitation requires network-level MITM. Remediation: upgrade to serenity 0.13+ when released.
#
# matrix-sdk 0.16.1 → imbl 6.1.0 → imbl-sized-chunks 0.1.3
# - RUSTSEC-2026-0292:
#   Double free / use-after-free in Chunk/InlineArray removal when an element's Drop panics.
# Risk assessment: Elements stored in matrix-sdk internal collections do not panic on drop.
# Remediation: upgrade matrix-sdk when a version supporting imbl >= 0.2 is adopted.
#
# matrix-sdk 0.16.1 → vodozemac 0.9.0
# - RUSTSEC-2026-0451:
#   Degraded secret zeroization capabilities in vodozemac 0.9.0.
# Risk assessment: Secret zeroization on drop is best-effort in process memory.
# Remediation: upgrade matrix-sdk when newer vodozemac is integrated.
ignore = [
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0292",
    "RUSTSEC-2026-0451",
]
